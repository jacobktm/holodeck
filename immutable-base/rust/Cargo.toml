[package]
name = "immutable"
version = "0.1.0"
edition = "2021"
description = "Immutable Pop!_OS management tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
