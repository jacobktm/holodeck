# cosmic-settings: tested via nested cosmic-session inside container.
# The container runs its own cosmic-session, cosmic-comp, cosmic-panel,
# and cosmic-settings-daemon. cosmic-settings connects to the container's
# session bus and affects the container's desktop.
nested_session = true
type = "app"
needs_logind = false
needs_udev = false
groups = ["render", "video"]

# GPU access for cosmic-comp (nested Wayland compositor)
[[mounts]]
host = "/dev/dri"
container = "/dev/dri"
options = "rw"

# Input devices (mouse/keyboard/touchpad)
[[mounts]]
host = "/dev/input"
container = "/dev/input"
options = "ro"

# Backlight control
[[mounts]]
host = "/sys/class/backlight"
container = "/sys/class/backlight"
options = "ro"

# rfkill for airplane mode detection
[[mounts]]
host = "/dev/rfkill"
container = "/dev/rfkill"
options = "ro"

# Input device enumeration (touchpad/mouse settings page)
[[mounts]]
host = "/sys/class/input"
container = "/sys/class/input"
options = "ro"

# Display connector info (display settings page)
[[mounts]]
host = "/sys/class/drm"
container = "/sys/class/drm"
options = "ro"

# Desktop entries (application launcher page)
[[mounts]]
host = "/usr/share/applications"
container = "/usr/share/applications"
options = "ro"

# Icon themes
[[mounts]]
host = "/usr/share/icons"
container = "/usr/share/icons"
options = "ro"

# Fonts
[[mounts]]
host = "/usr/share/fonts"
container = "/usr/share/fonts"
options = "ro"
