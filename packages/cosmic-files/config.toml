type = "app"
needs_logind = false
needs_udev = false
mount_host_libs = true
args = ["HOME"]
extra_packages = [
    "dbus", "gvfs-daemons", "gvfs-backends", "gvfs-fuse", "file", "less",
    "gstreamer1.0-plugins-base",
    "gstreamer1.0-plugins-good",
    "gstreamer1.0-plugins-bad",
    "gstreamer1.0-plugins-ugly",
    "gstreamer1.0-libav",
    "gsettings-desktop-schemas",
    "shared-mime-info",
    "eog",
    "packagekit",
    "appstream",
]
groups = ["render", "video", "fuse"]
host_bins = ["cosmic-store"]

# User's home directory (file manager needs to browse files)
[[mounts]]
host = "HOME"
container = "HOME"
options = "rw"

# COSMIC config (settings, context actions)
[[mounts]]
host = "HOME/.config/cosmic"
container = "HOME/.config/cosmic"
options = "rw"

# Desktop entries (file associations, app icons)
[[mounts]]
host = "/usr/share/applications"
container = "/usr/share/applications"
options = "ro"

# Icon themes
[[mounts]]
host = "/usr/share/icons"
container = "/usr/share/icons"
options = "ro"

# User icons
[[mounts]]
host = "HOME/.local/share/icons"
container = "HOME/.local/share/icons"
options = "ro"

# Fonts
[[mounts]]
host = "/usr/share/fonts"
container = "/usr/share/fonts"
options = "ro"

# Trash (uses trash-rs crate)
[[mounts]]
host = "HOME/.local/share/Trash"
container = "HOME/.local/share/Trash"
options = "rw"

# Appstream metadata (cosmic-store reads package info)
[[mounts]]
host = "/usr/share/appstream"
container = "/usr/share/appstream"
options = "ro"
